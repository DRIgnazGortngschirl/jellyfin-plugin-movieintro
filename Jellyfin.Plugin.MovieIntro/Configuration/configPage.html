<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Movie Intro</title>
</head>
<body>
    <div id="MovieIntroConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-checkbox,emby-select">
        <div data-role="content">
            <div class="content-primary">
                <h2>Movie Intro</h2>
                <p>Plays an intro clip from <code>/intros</code> before movies and/or series episodes (cinema mode). Clients need cinema mode switched on (web: Settings → Playback). Intros are not played when resuming.</p>
                <form id="MovieIntroConfigForm">
                    <div class="selectContainer">
                        <label class="selectLabel" for="IntroPath">Intro clip</label>
                        <select id="IntroPath" is="emby-select">
                            <option value="">Loading…</option>
                        </select>
                        <div id="ClipStatus" class="fieldDescription"></div>
                    </div>
                    <div>
                        <button id="ScanButton" is="emby-button" type="button" class="raised emby-button">
                            <span>Rescan /intros</span>
                        </button>
                    </div>

                    <div class="checkboxContainer">
                        <label class="emby-checkbox-label">
                            <input id="ApplyToMovies" type="checkbox" is="emby-checkbox" />
                            <span>Play before movies</span>
                        </label>
                    </div>
                    <div class="checkboxContainer">
                        <label class="emby-checkbox-label">
                            <input id="ApplyToEpisodes" type="checkbox" is="emby-checkbox" />
                            <span>Play before series episodes</span>
                        </label>
                    </div>

                    <div>
                        <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                            <span>Save</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
        <script type="text/javascript">
            (function () {
                var pluginUniqueId = '6f1c2a0e-5b7d-4c1e-9a43-2d8e7f0b1c55';
                var page = document.querySelector('#MovieIntroConfigPage');
                var savedPath = '';
                var selection = '';
                var refreshTimer = null;

                function $(selector) {
                    return page.querySelector(selector);
                }

                function addOption(select, value, text) {
                    var option = document.createElement('option');
                    option.value = value;
                    option.textContent = text;
                    select.appendChild(option);
                }

                function setStatus(text) {
                    $('#ClipStatus').textContent = text;
                }

                // Reload the list a few times while a scan runs, until every clip is in the library.
                function scheduleRefresh(attempt) {
                    clearTimeout(refreshTimer);
                    if (attempt < 6) {
                        refreshTimer = setTimeout(function () {
                            loadClips(attempt + 1);
                        }, 5000);
                    }
                }

                function loadClips(attempt) {
                    var select = $('#IntroPath');
                    var selected = selection;
                    return ApiClient.getJSON(ApiClient.getUrl('MovieIntro/Clips')).then(function (result) {
                        var clips = result.Clips || [];
                        var found = false;
                        var pending = 0;
                        select.innerHTML = '';
                        addOption(select, '', '— no intro —');
                        clips.forEach(function (clip) {
                            if (!clip.InLibrary) {
                                pending++;
                            }
                            found = found || clip.Path === selected;
                            addOption(select, clip.Path, clip.Name + (clip.InLibrary ? '' : ' (not scanned yet)'));
                        });
                        if (selected && !found) {
                            addOption(select, selected, (selected.indexOf('/intros/') === 0 ? '(missing) ' : '(outside /intros, will not play) ') + selected);
                        }
                        select.value = selected;

                        if (!result.FolderExists) {
                            setStatus(result.Folder + ' does not exist in the container. Mount your intro folder there.');
                        } else if (!result.LibraryFound) {
                            setStatus('No library for ' + result.Folder + ' yet. Add one (type Home Videos) with only that folder.');
                        } else if (!clips.length) {
                            setStatus('No video files in ' + result.Folder + '.');
                        } else if (pending) {
                            setStatus(pending + ' file(s) not scanned yet; the intro library is being scanned.');
                            scheduleRefresh(attempt || 0);
                        } else {
                            setStatus(clips.length + ' clip(s) in ' + result.Folder + '.');
                        }
                    }, function () {
                        select.innerHTML = '';
                        addOption(select, selection, selection ? selection : '— could not load clips —');
                        setStatus('Could not list /intros.');
                    });
                }

                page.addEventListener('pageshow', function () {
                    Dashboard.showLoadingMsg();
                    ApiClient.getPluginConfiguration(pluginUniqueId).then(function (config) {
                        savedPath = config.IntroPath || '';
                        selection = savedPath;
                        $('#ApplyToMovies').checked = config.ApplyToMovies;
                        $('#ApplyToEpisodes').checked = config.ApplyToEpisodes;
                        return loadClips(0);
                    }).then(function () {
                        Dashboard.hideLoadingMsg();
                    }, function () {
                        Dashboard.hideLoadingMsg();
                    });
                });

                page.addEventListener('pagehide', function () {
                    clearTimeout(refreshTimer);
                });

                $('#IntroPath').addEventListener('change', function () {
                    selection = this.value;
                });

                $('#ScanButton').addEventListener('click', function () {
                    ApiClient.ajax({ type: 'POST', url: ApiClient.getUrl('MovieIntro/Scan') }).then(function () {
                        setStatus('Scanning /intros…');
                        scheduleRefresh(0);
                    }, function () {
                        setStatus('No library for /intros yet. Add one (type Home Videos) with only that folder.');
                    });
                });

                $('#MovieIntroConfigForm').addEventListener('submit', function (e) {
                    Dashboard.showLoadingMsg();
                    ApiClient.getPluginConfiguration(pluginUniqueId).then(function (config) {
                        config.IntroPath = $('#IntroPath').value;
                        config.ApplyToMovies = $('#ApplyToMovies').checked;
                        config.ApplyToEpisodes = $('#ApplyToEpisodes').checked;
                        ApiClient.updatePluginConfiguration(pluginUniqueId, config).then(function (result) {
                            savedPath = config.IntroPath;
                            Dashboard.processPluginConfigurationUpdateResult(result);
                        });
                    });
                    e.preventDefault();
                    return false;
                });
            })();
        </script>
    </div>
</body>
</html>
