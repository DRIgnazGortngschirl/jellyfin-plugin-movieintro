<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Movie Intro</title>
</head>
<body>
    <div id="MovieIntroConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-checkbox,emby-textarea">
        <div data-role="content">
            <div class="content-primary">
                <h2>Movie Intro</h2>
                <p>Plays an intro clip before movies (cinema mode). The clip must live in a library folder that has been scanned. Clients need cinema mode switched on (web: Settings → Playback).</p>
                <form id="MovieIntroConfigForm">
                    <div class="checkboxContainer checkboxContainer-withDescription">
                        <label class="emby-checkbox-label">
                            <input id="Enabled" type="checkbox" is="emby-checkbox" />
                            <span>Enabled</span>
                        </label>
                    </div>
                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="IntroPath">Intro clip path (as seen by the server)</label>
                        <input id="IntroPath" type="text" is="emby-input" />
                    </div>
                    <div class="checkboxContainer checkboxContainer-withDescription">
                        <label class="emby-checkbox-label">
                            <input id="ApplyToAllMovies" type="checkbox" is="emby-checkbox" />
                            <span>Apply to all movies (ignore allow-list)</span>
                        </label>
                    </div>
                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="AllowedItemIds">Allowed movie item IDs (one per line)</label>
                        <textarea id="AllowedItemIds" is="emby-textarea" rows="8"></textarea>
                    </div>
                    <div>
                        <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                            <span>Save</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
        <script type="text/javascript">
            var MovieIntroConfig = { pluginUniqueId: '6f1c2a0e-5b7d-4c1e-9a43-2d8e7f0b1c55' };

            document.querySelector('#MovieIntroConfigPage').addEventListener('pageshow', function () {
                Dashboard.showLoadingMsg();
                ApiClient.getPluginConfiguration(MovieIntroConfig.pluginUniqueId).then(function (config) {
                    document.querySelector('#Enabled').checked = config.Enabled;
                    document.querySelector('#IntroPath').value = config.IntroPath;
                    document.querySelector('#ApplyToAllMovies').checked = config.ApplyToAllMovies;
                    document.querySelector('#AllowedItemIds').value = config.AllowedItemIds;
                    Dashboard.hideLoadingMsg();
                });
            });

            document.querySelector('#MovieIntroConfigForm').addEventListener('submit', function (e) {
                Dashboard.showLoadingMsg();
                ApiClient.getPluginConfiguration(MovieIntroConfig.pluginUniqueId).then(function (config) {
                    config.Enabled = document.querySelector('#Enabled').checked;
                    config.IntroPath = document.querySelector('#IntroPath').value;
                    config.ApplyToAllMovies = document.querySelector('#ApplyToAllMovies').checked;
                    config.AllowedItemIds = document.querySelector('#AllowedItemIds').value;
                    ApiClient.updatePluginConfiguration(MovieIntroConfig.pluginUniqueId, config).then(function (result) {
                        Dashboard.processPluginConfigurationUpdateResult(result);
                    });
                });
                e.preventDefault();
                return false;
            });
        </script>
    </div>
</body>
</html>
