name: Release

# Publish a GitHub release with a tag like v0.1.0.0 to build the plugin, attach the zip to the release and
# add it to manifest.json, the file Jellyfin reads as a plugin repository.
# To rebuild an existing release, use Actions → Release → Run workflow and enter its tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build, e.g. v0.1.0.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Read version from tag
        id: version
        run: |
          VERSION="${TAG#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Release tag must look like v1.2.3.4 (got $TAG)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip=movie-intro_${VERSION}.zip" >> "$GITHUB_OUTPUT"

      - name: Build and package
        run: |
          sh .github/scripts/package.sh "${{ steps.version.outputs.version }}"
          test -f "${{ steps.version.outputs.zip }}"
          unzip -l "${{ steps.version.outputs.zip }}"

      - name: Attach zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "${{ steps.version.outputs.zip }}" --clobber --repo "$GITHUB_REPOSITORY"

      - name: Update manifest.json on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP="${{ steps.version.outputs.zip }}"
          cp "$ZIP" /tmp/
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > /tmp/changelog.txt
          git fetch origin main
          git checkout -B main origin/main
          python3 .github/scripts/update_manifest.py "${{ steps.version.outputs.version }}" "/tmp/$ZIP" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/$ZIP" "$(cat /tmp/changelog.txt)"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if git diff --cached --quiet; then
            echo "manifest.json already up to date"
          else
            git commit -m "Add ${{ steps.version.outputs.version }} to manifest.json"
            git push origin main
          fi
