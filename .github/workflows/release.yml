name: Release

# Publish a GitHub release with a tag like v0.1.0.0 to build the plugin, attach the zip to the release and
# add it to manifest.json, the file Jellyfin reads as a plugin repository.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Read version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Release tag must look like v1.2.3.4 (got $GITHUB_REF_NAME)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and package
        id: package
        run: echo "zip=$(.github/scripts/package.sh ${{ steps.version.outputs.version }} | tail -n 1)" >> "$GITHUB_OUTPUT"

      - name: Attach zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "${{ steps.package.outputs.zip }}" --clobber

      - name: Update manifest.json on main
        env:
          CHANGELOG: ${{ github.event.release.body }}
        run: |
          ZIP="${{ steps.package.outputs.zip }}"
          cp "$ZIP" /tmp/
          git fetch origin main
          git checkout main
          python3 .github/scripts/update_manifest.py "${{ steps.version.outputs.version }}" "/tmp/$ZIP" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$ZIP" "${CHANGELOG:-}"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Add ${{ steps.version.outputs.version }} to manifest.json"
          git push origin main
